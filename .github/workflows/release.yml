name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'バージョンアップの種類'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/treetips/tree-image-optimizer

jobs:
  release:
    name: Build & Create Release
    runs-on: macos-latest

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release は main ブランチからのみ実行できます。"
            exit 1
          fi

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Bump version in Info.plist
      # セマンティックバージョンは「最新のリリースタグ」＋実行時の bump
      # 指定（major/minor/patch）から算出する。
      # ビルド番号は「最新のリリースの update-info.json の build」＋1
      # から算出する（Releaseが存在しない初回だけ Info.plist＋1）。
      # ローカルの手動更新は不要。Info.plist だけを書き換え、
      # main への push / PR 作成は行わない。
      # アプリが表示・比較するバージョンは静的な Info.plist の
      # CFBundleShortVersionString / CFBundleVersion が正本のため
      # （GENERATE_INFOPLIST_FILE=NO のため INFOPLIST_KEY_* は無視される）。
      # リポジトリルール（main への直接 push 禁止）を回避するため。
      # タグの push は許可されているためリリースはタグ経由で行う。
      # ------------------------------------------------------------
      - name: Bump version in Info.plist
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PLIST="TreeImageOptimizer/TreeImageOptimizer/Info.plist"
          # Draft タグは次回計算に含めず、公開済みの通常Releaseだけを基準にする。
          LATEST_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(startswith("v"))' \
            | sort -V | tail -n1)"
          if [[ -n "$LATEST_TAG" ]]; then
            CURRENT="${LATEST_TAG#v}"
          else
            CURRENT="$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if [[ -n "$LATEST_TAG" ]]; then
            # Why not 取得失敗時に Info.plist へ戻すか: 既存Releaseがある場合だけ
            # フォールバックすると、通信障害でビルド番号が非単調になるため。
            PREV_BUILD="$(curl -fsSL --retry 3 "${{ env.REPO_URL }}/releases/latest/download/update-info.json" \
              | python3 -c 'import json,sys; value=json.load(sys.stdin).get("build"); assert type(value) is int and value > 0; print(value)')"
            NEW_BUILD=$((PREV_BUILD + 1))
          else
            REPO_BUILD="$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")"
            NEW_BUILD=$((REPO_BUILD + 1))
          fi
          TAG_NAME="v${NEW_VERSION}"

          if ! [[ "$NEW_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be numeric: $NEW_BUILD"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $NEW_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $NEW_BUILD" "$PLIST"

          echo "Base tag:         ${LATEST_TAG:-none}"
          echo "Semantic version: $NEW_VERSION"
          echo "Build number:     $NEW_BUILD"
          echo "Tag name:         $TAG_NAME"

          {
            echo "version=$NEW_VERSION"
            echo "build_number=$NEW_BUILD"
            echo "tag=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Check existing tag
      # ------------------------------------------------------------
      - name: Check existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG は今回の main コミットではありません。"
              exit 1
            fi
            if RELEASE_STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
              if [[ "$RELEASE_STATE" != true ]]; then
                echo "::error::Tag $TAG の通常Releaseは既に公開されています。"
                exit 1
              fi
              echo "未公開Draft $TAG を再開します。"
            fi
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG は存在しますがタグが取得できません。"
            exit 1
          fi

      # ツール配布が無いままアプリを公開すると初回起動できないため、先に Release Tools を実行する。
      - name: Verify tools release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/tools-latest" > tools-release.json
          curl -fsSL --retry 3 --connect-timeout 10 \
            "$REPO_URL/releases/download/tools-latest/tools-info.json" -o tools-info.json
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          from urllib.parse import unquote, urlparse

          repository = os.environ["GITHUB_REPOSITORY"]
          release = json.loads(pathlib.Path("tools-release.json").read_text(encoding="utf-8"))
          manifest = json.loads(pathlib.Path("tools-info.json").read_text(encoding="utf-8"))
          if release.get("draft") is not False or release.get("prerelease") is not True:
              raise SystemExit("tools-latest は公開済みの事前リリースである必要があります")
          if type(manifest.get("schemaVersion")) is not int or manifest["schemaVersion"] != 1:
              raise SystemExit("tools-info.json の schemaVersion が不正です")
          expected = {"upscal", "jpegoptim", "pngoptim", "libjxl", "libavif", "libwebp", "realcugan"}
          entries = manifest.get("tools")
          if not isinstance(entries, list):
              raise SystemExit("tools-info.json の tools が不正です")
          assets = {asset.get("name") for asset in release.get("assets", []) if isinstance(asset, dict)}
          seen = set()
          referenced = set()
          prefix = f"/{repository}/releases/download/tools-latest/"
          for entry in entries:
              if not isinstance(entry, dict):
                  raise SystemExit("tools-info.json の entry が不正です")
              name, version = entry.get("name"), entry.get("version")
              if name not in expected or name in seen:
                  raise SystemExit(f"tools-info.json のツール名が不正です: {name}")
              if entry.get("required") is not True:
                  raise SystemExit(f"{name} は必須ツールである必要があります")
              checksum = entry.get("sha256")
              if not isinstance(checksum, str) or re.fullmatch(r"[0-9a-fA-F]{64}", checksum) is None:
                  raise SystemExit(f"{name} の SHA-256 が不正です")
              parsed = urlparse(entry.get("url", ""))
              filename = f"tools-{name}-{version}.zip"
              if parsed.scheme != "https" or parsed.netloc != "github.com" or not parsed.path.startswith(prefix):
                  raise SystemExit(f"{name} の配布URLが不正です")
              if unquote(parsed.path.rsplit("/", 1)[-1]) != filename:
                  raise SystemExit(f"{name} の配布ファイル名が不正です")
              seen.add(name)
              referenced.add(filename)
          if seen != expected:
              raise SystemExit("tools-info.json の必須7ツールが不足しています")
          if not {"tools-info.json", "SHA256SUMS.txt"} <= assets or not referenced <= assets:
              raise SystemExit("tools-latest に必須assetが不足しています")
          PY

      # ------------------------------------------------------------
      # Select Xcode version
      # `.xcode-version` に固定したXcodeを選択する（CIと同一）。
      # ------------------------------------------------------------
      - name: Select Xcode version
        run: |
          VERSION="$(cat .xcode-version)"
          echo "Required Xcode version: $VERSION"
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "/Applications/Xcode_${VERSION}.app/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run SwiftUI tests
        run: >
          xcodebuild
          -project TreeImageOptimizer/TreeImageOptimizer.xcodeproj
          -scheme TreeImageOptimizer
          -configuration Debug
          test

      # ------------------------------------------------------------
      # Build macOS release
      # バージョンは直前のステップで Info.plist に書き込み済み。
      # ------------------------------------------------------------
      - name: Build macOS release
        run: >
          xcodebuild
          -project TreeImageOptimizer/TreeImageOptimizer.xcodeproj
          -scheme TreeImageOptimizer
          -configuration Release
          -derivedDataPath "$GITHUB_WORKSPACE/build-release"
          build

      # ------------------------------------------------------------
      # Re-sign app (ad-hoc)
      # Developer Program へ未加入でも動作する形。最後に ad-hoc で
      # 再署名して署名の整合性を担保する。ダウンロード後は Gatekeeper の
      # 「開発者を確認できない」警告が出るため、ユーザーが手動で許可して
      # 起動する形となる。
      # ------------------------------------------------------------
      - name: Re-sign app (ad-hoc)
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build-release/Build/Products/Release/TreeImageOptimizer.app"
          echo "Re-signing app (deep, ad-hoc)..."
          codesign --force --deep --sign - "$APP_PATH"
          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"

      # ------------------------------------------------------------
      # Package release assets
      # 自前アップデート（UpdateService）が読むのは .app の zip と
      # update-info.json。tools は別の tools-latest Release で配布する。
      # ------------------------------------------------------------
      - name: Package release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # Why not AppleDouble（._*）を残すか: macOSの ditto は拡張属性を
          # `._*` としてアーカイブへ含めるため、生成を無効化する。
          export COPYFILE_DISABLE=1
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          APP_PATH="$GITHUB_WORKSPACE/build-release/Build/Products/Release/TreeImageOptimizer.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App not found at $APP_PATH"
            exit 1
          fi

          # ZIP を作成。
          ZIP_NAME="Tree-Image-Optimizer-v${VERSION}-macos.zip"
          mkdir -p dist-release
          ditto -c -k --keepParent "$APP_PATH" "dist-release/$ZIP_NAME"
          echo "Created: dist-release/$ZIP_NAME"

          # SHA-256 を計算。
          (cd dist-release && shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt)
          SHA256="$(awk '{print $1}' "dist-release/SHA256SUMS.txt")"
          echo "SHA-256: $SHA256"

          # update-info.json を生成。
          DOWNLOAD_URL="${{ env.REPO_URL }}/releases/download/v${VERSION}/${ZIP_NAME}"
          cat > dist-release/update-info.json <<EOF
          {
            "version": "${VERSION}",
            "build": ${BUILD},
            "url": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}"
          }
          EOF
          echo "Created: dist-release/update-info.json"
          cat dist-release/update-info.json

          {
            echo "zip_name=$ZIP_NAME"
            echo "zip_path=dist-release/$ZIP_NAME"
            echo "checksum_path=dist-release/SHA256SUMS.txt"
            echo "update_info_path=dist-release/update-info.json"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Create and push Git tag
      # ------------------------------------------------------------
      - name: Create and push Git tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      # ------------------------------------------------------------
      # Create, verify, and publish GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"
          TITLE="Tree Image Optimizer v${VERSION}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Why not 通常公開で先に作るか: assetアップロード失敗時に latest を
            # 壊れたReleaseへ切り替えないため。失敗時はDraftのまま再実行できる。
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --generate-notes \
              --draft
          fi

          gh release upload "$TAG" \
            "${{ steps.package.outputs.zip_path }}" \
            "${{ steps.package.outputs.checksum_path }}" \
            "${{ steps.package.outputs.update_info_path }}" \
            --clobber

          VERIFY_DIR="$RUNNER_TEMP/verify-release"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          gh release download "$TAG" \
            --pattern "$ZIP_NAME" \
            --pattern "SHA256SUMS.txt" \
            --pattern "update-info.json" \
            --dir "$VERIFY_DIR"
          (cd "$VERIFY_DIR" && shasum -a 256 -c SHA256SUMS.txt)
          python3 - "$VERIFY_DIR/update-info.json" "$VERSION" "$BUILD" "$TAG" "$ZIP_NAME" <<'PY'
          import json
          import pathlib
          import sys

          path, version, build, tag, zip_name = sys.argv[1:]
          info = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          expected_url = f"https://github.com/treetips/tree-image-optimizer/releases/download/{tag}/{zip_name}"
          if info.get("version") != version or info.get("build") != int(build) or info.get("url") != expected_url:
              raise SystemExit("公開した update-info.json の内容が一致しません")
          if not isinstance(info.get("sha256"), str) or len(info["sha256"]) != 64:
              raise SystemExit("公開した update-info.json の SHA-256 が不正です")
          PY

          gh release edit "$TAG" --draft=false --prerelease=false --latest
